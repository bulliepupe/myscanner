<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f1ec">
<meta name="description" content="MyScanner: scanner di documenti con raddrizzamento, filtri, OCR, firma e PDF. Tutto resta sul tuo telefono.">
<title>MyScanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ARCHIVIO -->
<section id="s-home" class="screen active">
  <header class="home-head">
    <div class="brand"><img src="icons/logo.svg" alt=""><span>My<b>Scanner</b></span></div>
    <span class="count-pill" id="doc-count"></span>
  </header>
  <div class="home-scroll" id="home-scroll">
    <h1 class="greet" id="greet">Documenti</h1>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Cerca per nome o nel testo"></div>
    <div class="chips" id="folder-chips"></div>
    <div class="section-label" id="list-label">Recenti</div>
    <div id="doc-list" class="doc-list"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-art"><i></i><i></i><i></i><b></b></div>
      <h2>Ancora nessun documento</h2>
      <p>Tocca il pulsante blu e inquadra un foglio. Bordi, ritaglio e pulizia li sistema l'app.</p>
    </div>
  </div>
  <nav class="dock">
    <button id="btn-import"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg><span>Importa</span></button>
    <button class="scan-btn" id="btn-scan" aria-label="Scansiona"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg></button>
    <button id="btn-settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Impostazioni</span></button>
  </nav>
  <input type="file" id="file-import" accept="image/*" multiple hidden>
</section>

<!-- FOTOCAMERA -->
<section id="s-camera" class="screen dark">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="cam-overlay"></canvas>
  <div class="cam-top">
    <button class="icon-btn light" id="cam-close" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="seg" id="cam-mode"><button data-mode="single" class="on">Singola</button><button data-mode="batch">Multipla</button></div>
    <button class="icon-btn light" id="cam-torch" aria-label="Flash"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg></button>
  </div>
  <div class="cam-hint" id="cam-hint">Inquadra il documento</div>
  <div class="cam-bottom">
    <button class="cam-gallery" id="cam-gallery" aria-label="Galleria"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg></button>
    <button class="shutter" id="cam-shutter" aria-label="Scatta"><span></span></button>
    <button class="cam-queue" id="cam-done" aria-label="Fatto"><img id="cam-thumb" alt=""><b id="cam-count">0</b></button>
  </div>
  <div class="flash-fx" id="flash-fx"></div>
  <div class="cam-busy hidden" id="cam-busy"><canvas id="cam-freeze"></canvas><div><i class="spinner"></i><span>Elaboro la foto…</span></div></div>
</section>

<!-- RITAGLIO -->
<section id="s-crop" class="screen dark">
  <header class="topbar dark">
    <button class="icon-btn light" id="crop-back" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="title" id="crop-title">Ritaglia</div>
    <button class="text-btn accent" id="crop-next">Avanti</button>
  </header>
  <div class="crop-stage" id="crop-stage">
    <canvas id="crop-canvas"></canvas>
    <svg id="crop-svg"></svg>
    <div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
    <div class="mid" data-i="0"></div><div class="mid" data-i="1"></div><div class="mid" data-i="2"></div><div class="mid" data-i="3"></div>
    <canvas id="loupe" width="120" height="120"></canvas>
  </div>
  <div class="toolbar dark">
    <button id="crop-auto"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Auto</button>
    <button id="crop-full"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>Tutto</button>
    <button id="crop-rotl"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ruota</button>
    <button id="crop-del"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Scarta</button>
  </div>
</section>

<!-- FILTRI -->
<section id="s-filter" class="screen dark">
  <header class="topbar dark">
    <button class="icon-btn light" id="filter-back" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="title" id="filter-title">Migliora</div>
    <button class="text-btn accent" id="filter-save">Salva</button>
  </header>
  <div class="filter-stage"><canvas id="filter-img"></canvas><div class="busy hidden" id="filter-busy"><i></i></div></div>
  <div class="pager" id="filter-pager"><button id="fp-prev">‹</button><span id="fp-label">1/1</span><button id="fp-next">›</button></div>
  <div class="sliders hidden" id="sliders">
    <label>Luminosità <input type="range" id="adj-b" min="-60" max="60" value="0"></label>
    <label>Contrasto <input type="range" id="adj-c" min="-50" max="60" value="0"></label>
    <label>Nitidezza <input type="range" id="adj-s" min="0" max="100" value="0"></label>
  </div>
  <div class="filter-strip" id="filter-strip"></div>
  <div class="toolbar dark">
    <button id="f-rot"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Ruota</button>
    <button id="f-adj"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Regola</button>
    <button id="f-all"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="14" rx="1"/><path d="M8 3h12v14"/></svg>A tutte</button>
    <button id="f-recrop"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Ritaglia</button>
  </div>
</section>

<!-- DOCUMENTO -->
<section id="s-doc" class="screen">
  <header class="topbar">
    <button class="icon-btn" id="doc-back" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <button class="title editable" id="doc-title">Documento</button>
    <button class="icon-btn" id="doc-more" aria-label="Altro"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
  </header>
  <div class="doc-meta" id="doc-meta"></div>
  <div class="page-grid" id="page-grid"></div>
  <div class="bottom-actions">
    <button id="act-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
    <button id="act-ocr"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>Testo</button>
    <button id="act-sign"><svg viewBox="0 0 24 24"><path d="M3 17c3-3 4-9 6-9s0 9 3 9 3-4 5-4 2 3 4 3"/><path d="M3 21h18"/></svg>Firma</button>
    <button id="act-pdf" class="primary"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>PDF</button>
  </div>
</section>

<!-- PAGINA SINGOLA -->
<section id="s-page" class="screen dark">
  <header class="topbar dark">
    <button class="icon-btn light" id="page-back" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="title" id="page-title">Pagina</div>
    <button class="icon-btn light" id="page-share" aria-label="Condividi"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
  </header>
  <div class="page-view" id="page-view"><img id="page-img" alt=""></div>
  <div class="toolbar dark">
    <button id="pg-edit"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filtri</button>
    <button id="pg-annot"><svg viewBox="0 0 24 24"><path d="m15 5 4 4L8 20H4v-4L15 5Z"/></svg>Annota</button>
    <button id="pg-ocr"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>Testo</button>
    <button id="pg-left"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg>Sposta</button>
    <button id="pg-del"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Elimina</button>
  </div>
</section>

<!-- ANNOTAZIONI -->
<section id="s-annot" class="screen dark">
  <header class="topbar dark">
    <button class="icon-btn light" id="an-cancel" aria-label="Annulla"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="title">Annota e firma</div>
    <button class="text-btn accent" id="an-save">Applica</button>
  </header>
  <div class="annot-stage" id="annot-stage">
    <div class="annot-wrap" id="annot-wrap">
      <img id="annot-base" alt="">
      <canvas id="annot-canvas"></canvas>
      <div id="annot-items"></div>
    </div>
  </div>
  <div class="annot-colors" id="annot-colors"></div>
  <div class="toolbar dark">
    <button data-tool="pen" class="on"><svg viewBox="0 0 24 24"><path d="m15 5 4 4L8 20H4v-4L15 5Z"/></svg>Penna</button>
    <button data-tool="hl"><svg viewBox="0 0 24 24"><path d="m9 15 6-6 3 3-6 6H9v-3Z"/><path d="M4 21h8"/></svg>Evidenzia</button>
    <button data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Testo</button>
    <button data-tool="sign"><svg viewBox="0 0 24 24"><path d="M3 17c3-3 4-9 6-9s0 9 3 9 3-4 5-4 2 3 4 3"/></svg>Firma</button>
    <button id="an-undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Annulla</button>
  </div>
</section>

<!-- Fogli modali -->
<div class="sheet-back hidden" id="sheet-back"></div>
<div class="sheet hidden" id="sheet"></div>
<div class="toast hidden" id="toast"></div>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
